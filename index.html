<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Tennis Zone Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1c1d21;
    margin: 0;
    padding: 16px;
    color: #f2f2f0;
  }
  .page { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; color: #f2f2f0; }
  .sub { font-size: 13px; color: #9a9a96; margin-bottom: 16px; }

  @media (min-width: 700px) {
    body { padding: 32px 16px; }
    h1 { font-size: 26px; }
    .sub { font-size: 15px; margin-bottom: 24px; }
    .card { padding: 22px; }
    label, input, button { font-size: 16px; }
    .section-title { font-size: 17px; }
    .zone-pct { font-size: 24px !important; }
    .zone-count { font-size: 12px !important; }
    .name-bar { font-size: 16px !important; padding: 10px 16px !important; }
    .banner { font-size: 16px !important; padding: 10px 24px !important; }
  }
  .card {
    background: #26272c;
    border: 1px solid #35363c;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 4px; color: #cfcfcb; }
  input {
    width: 100%; padding: 8px 10px; font-size: 15px;
    border: 1px solid #46474d; border-radius: 8px; margin-bottom: 10px;
    background: #1c1d21; color: #f2f2f0;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    padding: 10px 14px; font-size: 14px; font-weight: 500; border-radius: 8px;
    border: 1px solid #46474d; background: #2f3035; color: #f2f2f0; cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .primary { background: #d81e2c; color: #fff; border-color: #d81e2c; }
  .share-btn { background: #1e6fd8; color: #fff; border-color: #1e6fd8; }
  .clear-btn { font-size: 12px; padding: 4px 10px; color: #ff8a8a; border-color: #5c3232; background: #2f2020; }
  .section-title { font-size: 14px; font-weight: 600; margin: 4px 0 10px; display: flex; align-items: center; justify-content: space-between; color: #f2f2f0; }

  .banner {
    text-align: center;
    background: #17181b;
    border: 1px solid #d81e2c;
    color: #f2f2f0;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 6px;
    margin: -6px auto 14px;
    width: fit-content;
  }
  .banner.shared { border-color: #1e6fd8; }

  .perspective-wrap {
    perspective: 1100px;
    padding: 10px 0 46px;
  }
  .table-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 274 / 152.5;
    background: #0e0f11;
    border: 2px solid #ffffff;
    border-radius: 6px;
    overflow: hidden;
    transform: rotateX(48deg);
    transform-origin: 50% 100%;
    box-shadow: 0 30px 40px -10px rgba(0,0,0,0.7);
  }
  .table-legs {
    position: relative;
    height: 0;
  }
  .table-legs::before, .table-legs::after {
    content: '';
    position: absolute;
    top: -30px;
    width: 10px;
    height: 34px;
    background: linear-gradient(#3a3b40, #1c1d21);
    border-radius: 0 0 2px 2px;
  }
  .table-legs::before { left: 12%; }
  .table-legs::after { right: 12%; }
  .center-line {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 3px; background: #ffffff; transform: translateX(-50%); z-index: 3;
  }
  .zone-grid {
    position: absolute; top: 0; bottom: 0; width: 50%;
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
    z-index: 1;
  }
  .zone-grid.left { left: 0; }
  .zone-grid.right { right: 0; }
  .zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    border-radius: 3px;
    transition: background 0.15s;
  }
  .zone-pct { font-size: 18px; font-weight: 700; line-height: 1; }
  .zone-count { font-size: 10px; opacity: 0.75; margin-top: 3px; }
  .zone:active { transform: scale(0.96); }

  .name-bars { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .name-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    background: #0e0f11;
  }
  .name-bar.opp { border-left: 4px solid #d81e2c; justify-content: flex-start; }
  .name-bar.own { border-right: 4px solid #1e6fd8; justify-content: flex-end; text-align: right; flex-direction: row-reverse; }
  .name-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .name-swatch.opp { background: #d81e2c; }
  .name-swatch.own { background: #1e6fd8; }
  .name-bar input {
    margin: 0; padding: 4px 6px; font-size: 13px; border: none;
    background: transparent; color: #f2f2f0; width: 100%;
  }
  .name-bar.own input { text-align: right; }

  .totals { font-size: 12px; color: #9a9a96; margin-top: 10px; text-align: center; }
  .saved-list { font-size: 13px; }
  .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #35363c; }
  .saved-item:last-child { border-bottom: none; }
  .saved-item button { padding: 4px 10px; font-size: 12px; }
  .status { font-size: 12px; color: #9a9a96; text-align: center; margin-top: 8px; min-height: 16px; }
  .share-box { display: none; margin-top: 10px; }
  .share-box textarea {
    width: 100%; min-height: 60px; font-size: 12px; padding: 8px;
    border: 1px solid #46474d; border-radius: 8px; background: #1c1d21; color: #f2f2f0;
    resize: vertical;
  }
</style>
</head>
<body>
<div class="page">

<h1>Zone tracker</h1>
<div class="sub">Tap a zone each time a shot lands there. Percentages update live. Saved sessions stay on this device/browser only — use Share link to send a snapshot to someone else.</div>

<div class="card">
  <label for="oppName">Opponent name</label>
  <input id="oppNameInput" placeholder="e.g. Freddie Tan" />
  <label for="ownNameInput">Your name</label>
  <input id="ownNameInput" placeholder="e.g. You" value="You" />
  <div class="row">
    <button id="saveBtn" class="primary">Save session</button>
    <button id="loadListBtn">Load saved</button>
  </div>
  <div class="row" style="margin-top:8px;">
    <button id="shareBtn" class="share-btn">Share link</button>
  </div>
  <div class="share-box" id="shareBox">
    <textarea id="shareLinkText" readonly></textarea>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="card" id="loadCard" style="display:none;">
  <div class="section-title">Saved sessions <button class="clear-btn" id="closeLoad">Close</button></div>
  <div class="saved-list" id="savedList"></div>
</div>

<div class="card">
  <div class="section-title">
    Shot placement
    <span>
      <button class="clear-btn" data-clear="opp">Clear opp.</button>
      <button class="clear-btn" data-clear="own">Clear mine</button>
    </span>
  </div>
  <div class="banner" id="banner">Winners — live session</div>
  <div class="table-wrap">
    <div class="zone-grid left" id="grid-opp"></div>
    <div class="zone-grid right" id="grid-own"></div>
    <div class="center-line"></div>
  </div>
  <div class="name-bars">
    <div class="name-bar opp">
      <span class="name-swatch opp"></span>
      <input id="oppNameTag" readonly />
    </div>
    <div class="name-bar own">
      <input id="ownNameTag" readonly />
      <span class="name-swatch own"></span>
    </div>
  </div>
  <div class="totals" id="totals">0 / 0 shots logged</div>
</div>

<script>
const rowLabels = ['Wide L', 'Middle', 'Wide R'];

let data = {
  opp: [0,0,0,0,0,0,0,0,0],
  own: [0,0,0,0,0,0,0,0,0]
};

function colorForSide(side, count) {
  const totalStops = 14;
  const idx = Math.min(totalStops - 1, Math.max(0, count - 1));
  const baseHue = side === 'opp' ? 355 : 212;
  const lightStart = 88;
  const lightEnd = 14;
  const lightness = lightStart - (idx / (totalStops - 1)) * (lightStart - lightEnd);
  const satStart = 45;
  const satEnd = 85;
  const saturation = satStart + (idx / (totalStops - 1)) * (satEnd - satStart);
  const hueShift = (idx / (totalStops - 1)) * (side === 'opp' ? -12 : 12);
  const hue = baseHue + hueShift;
  if (count === 0) {
    return side === 'opp' ? 'hsl(355, 40%, 20%)' : 'hsl(212, 40%, 18%)';
  }
  return hsl(${hue}, ${saturation}%, ${lightness}%);
}

function render(side) {
  const grid = document.getElementById('grid-' + side);
  grid.innerHTML = '';
  const arr = data[side];
  const total = arr.reduce((a,b) => a+b, 0);

  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      const i = row * 3 + col;
      const count = arr[i];
      const pct = total > 0 ? Math.round((count/total)*100) : 0;
      const div = document.createElement('div');
      div.className = 'zone';
      div.style.background = colorForSide(side, count);
      div.style.color = count > 0 && count <= 7 ? '#1c1d21' : '#f2f2f0';
      div.innerHTML = <span class="zone-pct">${pct}%</span><span class="zone-count">${count} shots</span>;
      div.addEventListener('click', () => {
        data[side][i]++;
        render(side);
        updateTotals();
      });
      grid.appendChild(div);
    }
  }
}

function updateTotals() {
  const oppTotal = data.opp.reduce((a,b) => a+b, 0);
  const ownTotal = data.own.reduce((a,b) => a+b, 0);
  document.getElementById('totals').textContent = oppTotal + ' opp. / ' + ownTotal + ' mine logged';
}

function updateNameTags() {
  const oppName = document.getElementById('oppNameInput').value.trim() || 'Opponent';
  const ownName = document.getElementById('ownNameInput').value.trim() || 'You';
  document.getElementById('oppNameTag').value = oppName.toUpperCase();
  document.getElementById('ownNameTag').value = ownName.toUpperCase();
}

document.getElementById('oppNameInput').addEventListener('input', updateNameTags);
document.getElementById('ownNameInput').addEventListener('input', updateNameTags);

document.querySelectorAll('[data-clear]').forEach(btn => {
  btn.addEventListener('click', () => {
    const side = btn.getAttribute('data-clear');
    data[side] = [0,0,0,0,0,0,0,0,0];
    render(side);
    updateTotals();
  });
});

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 2500);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('oppNameInput').value.trim();
  if (!name) {
    showStatus('Enter an opponent name first');
    return;
  }
  try {
    const ownName = document.getElementById('ownNameInput').value.trim() || 'You';
    const record = { name, ownName, data, savedAt: new Date().toISOString() };
    localStorage.setItem('tt_session:' + name, JSON.stringify(record));
    showStatus('Saved: ' + name);
  } catch (e) {
    showStatus('Save failed, try again');
  }
});

document.getElementById('loadListBtn').addEventListener('click', () => {
  const card = document.getElementById('loadCard');
  card.style.display = 'block';
  const listEl = document.getElementById('savedList');
  const keys = Object.keys(localStorage).filter(k => k.startsWith('tt_session:'));
  if (keys.length === 0) {
    listEl.innerHTML = '<div style="color:#9a9a96;">No saved sessions yet.</div>';
    return;
  }
  listEl.innerHTML = '';
  keys.forEach(key => {
    try {
      const record = JSON.parse(localStorage.getItem(key));
      const row = document.createElement('div');
      row.className = 'saved-item';
      row.innerHTML = <span>${record.name}</span>;
      const btnGroup = document.createElement('span');
      const loadBtn = document.createElement('button');
      loadBtn.textContent = 'Load';
      loadBtn.style.marginRight = '6px';
      loadBtn.addEventListener('click', () => {
        data = record.data;
        document.getElementById('oppNameInput').value = record.name;
        document.getElementById('ownNameInput').value = record.ownName || 'You';
        updateNameTags();
        render('opp');
        render('own');
        updateTotals();
        card.style.display = 'none';
        showStatus('Loaded: ' + record.name);
      });
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.className = 'clear-btn';
      delBtn.addEventListener('click', () => {
        localStorage.removeItem(key);
        row.remove();
        showStatus('Deleted: ' + record.name);
      });
      btnGroup.appendChild(loadBtn);
      btnGroup.appendChild(delBtn);
      row.appendChild(btnGroup);
      listEl.appendChild(row);
    } catch (e) {}
  });
});

document.getElementById('closeLoad').addEventListener('click', () => {
  document.getElementById('loadCard').style.display = 'none';
});

// ---- Share link feature ----
// Packs the current session (names + zone data) into a base64 string in the URL
// so anyone who opens the link sees this exact snapshot, no localStorage needed.

function encodeSession(record) {
  const json = JSON.stringify(record);
  return encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
}

function decodeSession(str) {
  const json = decodeURIComponent(escape(atob(decodeURIComponent(str))));
  return JSON.parse(json);
}

document.getElementById('shareBtn').addEventListener('click', () => {
  const oppName = document.getElementById('oppNameInput').value.trim() || 'Opponent';
  const ownName = document.getElementById('ownNameInput').value.trim() || 'You';
  const record = { name: oppName, ownName, data };
  const encoded = encodeSession(record);
  const url = location.origin + location.pathname + '?share=' + encoded;

  const box = document.getElementById('shareBox');
  const textArea = document.getElementById('shareLinkText');
  textArea.value = url;
  box.style.display = 'block';
  textArea.select();

  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      showStatus('Share link copied to clipboard');
    }).catch(() => {
      showStatus('Link ready below — copy it manually');
    });
  } else {
    showStatus('Link ready below — copy it manually');
  }
});

function loadFromUrlIfPresent() {
  const params = new URLSearchParams(location.search);
  const shared = params.get('share');
  if (!shared) return false;
  try {
    const record = decodeSession(shared);
    data = record.data;
    document.getElementById('oppNameInput').value = record.name;
    document.getElementById('ownNameInput').value = record.ownName || 'You';
    const banner = document.getElementById('banner');
    banner.textContent = 'Shared session — ' + record.name + ' vs ' + (record.ownName || 'You');
    banner.classList.add('shared');
    return true;
  } catch (e) {
    return false;
  }
}

const loadedShared = loadFromUrlIfPresent();
updateNameTags();
render('opp');
render('own');
updateTotals();
</script>

</div>
</body>
</html>
