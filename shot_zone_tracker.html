<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Tennis Zone Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f3ee;
    margin: 0;
    padding: 16px;
    color: #2c2c2a;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b6a63; margin-bottom: 16px; }

  @media (min-width: 700px) {
    body { padding: 32px 16px; }
    h1 { font-size: 26px; }
    .sub { font-size: 15px; margin-bottom: 24px; }
    .card { padding: 22px; }
    label, input, button { font-size: 16px; }
    .section-title { font-size: 17px; }
    .side-labels { font-size: 14px; }
    .zone { font-size: 13px; line-height: 1.5; }
    .zone .pct { font-size: 12px; }
    .totals { font-size: 14px; }
  }
  .card {
    background: #ffffff;
    border: 1px solid #e2e0d8;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; font-size: 15px; border: 1px solid #d3d1c7; border-radius: 8px; margin-bottom: 10px; background: #fbfaf6; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { padding: 10px 14px; font-size: 14px; font-weight: 500; border-radius: 8px; border: 1px solid #d3d1c7; background: #fff; cursor: pointer; }
  button:active { transform: scale(0.98); }
  .primary { background: #2c2c2a; color: #fff; border-color: #2c2c2a; }
  .clear-btn { font-size: 12px; padding: 4px 10px; color: #a32d2d; border-color: #f0c1c1; }
  .section-title { font-size: 14px; font-weight: 600; margin: 4px 0 10px; display: flex; align-items: center; justify-content: space-between; }
  .side-labels { display: flex; justify-content: space-between; font-size: 12px; color: #6b6a63; margin-bottom: 6px; padding: 0 2px; }

  .table-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 274 / 152.5;
    background: #14588a;
    border: 3px solid #ffffff;
    border-radius: 4px;
    overflow: hidden;
  }
  .center-line {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 3px;
    background: #ffffff;
    transform: translateX(-50%);
    z-index: 3;
  }
  .doubles-line {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: rgba(255,255,255,0.4);
    transform: translateY(-50%);
    z-index: 2;
  }
  .zone-grid {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    grid-template-columns: repeat(3, 1fr);
    z-index: 1;
  }
  .zone-grid.left { left: 0; }
  .zone-grid.right { right: 0; }
  .zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    color: #ffffff;
    cursor: pointer;
    user-select: none;
    border: 0.5px solid rgba(255,255,255,0.25);
    transition: background 0.15s;
    text-align: center;
    line-height: 1.3;
  }
  .zone .pct { font-size: 9px; font-weight: 400; opacity: 0.85; margin-top: 2px; }
  .zone:active { transform: scale(0.96); }
  .totals { font-size: 12px; color: #6b6a63; margin-top: 8px; text-align: center; }
  .saved-list { font-size: 13px; }
  .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
  .saved-item:last-child { border-bottom: none; }
  .saved-item button { padding: 4px 10px; font-size: 12px; }
  .status { font-size: 12px; color: #6b6a63; text-align: center; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<div class="page">

<h1>Zone tracker</h1>
<div class="sub">Tap a zone each time a shot lands there. Table shown to scale, net in the middle. 9 zones per side.</div>

<div class="card">
  <label for="oppName">Opponent name</label>
  <input id="oppName" placeholder="e.g. Freddie Tan" />
  <div class="row">
    <button id="saveBtn" class="primary">Save session</button>
    <button id="loadListBtn">Load saved</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="card" id="loadCard" style="display:none;">
  <div class="section-title">Saved sessions <button class="clear-btn" id="closeLoad">Close</button></div>
  <div class="saved-list" id="savedList"></div>
</div>

<div class="card">
  <div class="section-title">
    Shot placement
    <span>
      <button class="clear-btn" data-clear="opp">Clear opp.</button>
      <button class="clear-btn" data-clear="own">Clear mine</button>
    </span>
  </div>
  <div class="side-labels">
    <span>Opponent's side (your shots)</span>
    <span>Your side (their shots)</span>
  </div>
  <div class="table-wrap">
    <div class="doubles-line"></div>
    <div class="zone-grid left" id="grid-opp"></div>
    <div class="zone-grid right" id="grid-own"></div>
    <div class="center-line"></div>
  </div>
  <div class="totals" id="totals">0 / 0 shots logged</div>
</div>

<script>
// Each side: 3 rows (Wide L, Middle, Wide R) x 3 cols (depth: Short/Mid/Long) = 9 zones
// Left half (opponent's side): net is at the right edge (center), baseline is at the left edge
//   -> columns left-to-right (baseline to net): [Long, Mid, Short]
// Right half (your side): net is at the left edge (center), baseline is at the right edge
//   -> columns left-to-right (net to baseline): [Short, Mid, Long]
const rowLabels = ['Wide L', 'Middle', 'Wide R'];

let data = {
  opp: [0,0,0,0,0,0,0,0,0], // index: row*3+col
  own: [0,0,0,0,0,0,0,0,0]
};

function colorFor(count, max) {
  if (count === 0) return 'rgba(255,255,255,0.06)';
  const ratio = max > 0 ? count / max : 0;
  const stops = ['rgba(93,202,165,0.35)','rgba(29,158,117,0.55)','rgba(15,110,86,0.7)','rgba(8,80,65,0.85)','rgba(4,52,44,0.95)'];
  const idx = Math.min(stops.length - 1, Math.floor(ratio * (stops.length - 1)));
  return stops[idx];
}

function render(side) {
  const grid = document.getElementById('grid-' + side);
  grid.innerHTML = '';
  const arr = data[side];
  const total = arr.reduce((a,b) => a+b, 0);
  const max = Math.max(...arr);
  const colLabels = side === 'opp' ? ['Long', 'Mid', 'Short'] : ['Short', 'Mid', 'Long'];

  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      const i = row * 3 + col;
      const count = arr[i];
      const pct = total > 0 ? Math.round((count/total)*100) : 0;
      const div = document.createElement('div');
      div.className = 'zone';
      div.style.background = colorFor(count, max);
      div.innerHTML = `<span>${rowLabels[row]}<br>${colLabels[col]}</span><span class="pct">${count} (${pct}%)</span>`;
      div.addEventListener('click', () => {
        data[side][i]++;
        render(side);
        updateTotals();
      });
      grid.appendChild(div);
    }
  }
}

function updateTotals() {
  const oppTotal = data.opp.reduce((a,b) => a+b, 0);
  const ownTotal = data.own.reduce((a,b) => a+b, 0);
  document.getElementById('totals').textContent = oppTotal + ' opp. / ' + ownTotal + ' mine logged';
}

document.querySelectorAll('[data-clear]').forEach(btn => {
  btn.addEventListener('click', () => {
    const side = btn.getAttribute('data-clear');
    data[side] = [0,0,0,0,0,0,0,0,0];
    render(side);
    updateTotals();
  });
});

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 2500);
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('oppName').value.trim();
  if (!name) {
    showStatus('Enter an opponent name first');
    return;
  }
  try {
    const record = { name, data, savedAt: new Date().toISOString() };
    const result = await window.storage.set('session:' + name, JSON.stringify(record));
    if (result) {
      showStatus('Saved: ' + name);
    } else {
      showStatus('Save failed, try again');
    }
  } catch (e) {
    showStatus('Save failed, try again');
  }
});

document.getElementById('loadListBtn').addEventListener('click', async () => {
  const card = document.getElementById('loadCard');
  card.style.display = 'block';
  const listEl = document.getElementById('savedList');
  listEl.innerHTML = 'Loading...';
  try {
    const result = await window.storage.list('session:');
    const keys = result && result.keys ? result.keys : [];
    if (keys.length === 0) {
      listEl.innerHTML = '<div style="color:#6b6a63;">No saved sessions yet.</div>';
      return;
    }
    listEl.innerHTML = '';
    for (const key of keys) {
      try {
        const item = await window.storage.get(key);
        const record = JSON.parse(item.value);
        const row = document.createElement('div');
        row.className = 'saved-item';
        row.innerHTML = `<span>${record.name}</span>`;
        const loadBtn = document.createElement('button');
        loadBtn.textContent = 'Load';
        loadBtn.addEventListener('click', () => {
          data = record.data;
          document.getElementById('oppName').value = record.name;
          render('opp');
          render('own');
          updateTotals();
          card.style.display = 'none';
          showStatus('Loaded: ' + record.name);
        });
        row.appendChild(loadBtn);
        listEl.appendChild(row);
      } catch (e) {}
    }
  } catch (e) {
    listEl.innerHTML = '<div style="color:#a32d2d;">Could not load sessions.</div>';
  }
});

document.getElementById('closeLoad').addEventListener('click', () => {
  document.getElementById('loadCard').style.display = 'none';
});

render('opp');
render('own');
updateTotals();
</script>

</div>
</body>
</html>
